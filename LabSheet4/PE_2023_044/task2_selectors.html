<html>
<head>
    <style type="text/css">
        h1, h2, h3 {
            font-family: "Georgia", serif;
            border-bottom: 2px solid #333333;
        }
        .center {
            text-align: center;
        }
        p.center {
            color: teal;
        }
        .bold-text {
            font-weight: bold;
        }
        #lead-banner {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 15px;
        }
        input[type="text"] {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>
    <div id="lead-banner">
        <h1>Welcome to CSS Selectors Lab</h1>
        <p>This banner is uniquely styled using the ID selector #lead-banner.</p>
    </div>

    <h2 class="center">Sub-Heading Centered</h2>

    <p class="center bold-text">
        This paragraph uses both .center and .bold-text classes simultaneously.
    </p>

    <form>
        Search Query:
        <input type="text" name="search" placeholder="Type here...">
        <input type="submit" value="Submit">
    </form>

</body>
</html>
